<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232336"/>
      <stop offset="1" stop-color="#16161d"/>
    </linearGradient>
  </defs>

  <!-- macOS-style rounded square with margin -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="none" stroke="#3a3a4c" stroke-width="6"/>

  <!-- board: three agent session rows with status dots -->
  <rect x="180" y="440" width="520" height="86" rx="43" fill="#2e2e3e"/>
  <circle cx="238" cy="483" r="27" fill="#34d399"/>

  <rect x="180" y="576" width="430" height="86" rx="43" fill="#2e2e3e"/>
  <circle cx="238" cy="619" r="27" fill="#fbbf24"/>

  <rect x="180" y="712" width="480" height="86" rx="43" fill="#2e2e3e"/>
  <circle cx="238" cy="755" r="27" fill="#a78bfa"/>

  <!-- notification ping broadcasting from top-right -->
  <circle cx="700" cy="308" r="44" fill="#7c5cff"/>
  <path d="M 799 308 A 99 99 0 0 0 700 209" fill="none" stroke="#7c5cff" stroke-width="36" stroke-linecap="round"/>
  <path d="M 863 308 A 163 163 0 0 0 700 145" fill="none" stroke="#7c5cff" stroke-width="36" stroke-linecap="round" opacity="0.55"/>
</svg>
